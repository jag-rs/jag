[package]
name = "jag-shaders"
version = "0.1.1"
description = "WGSL shader modules for jag-draw"
license = "MIT"
repository.workspace = true
homepage.workspace = true
edition = "2024"
keywords = ["gpu", "shaders", "wgsl", "wgpu", "rendering"]
categories = ["graphics", "rendering"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
bytemuck = { workspace = true }

[dev-dependencies]
naga = { version = "=30.0.0", features = ["wgsl-in"] }
